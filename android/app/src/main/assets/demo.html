<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#f8f4eb;color:#241e16;font:18px sans-serif;margin:0}header{background:#191714;color:#e7c47d;padding:24px;text-align:center;font-size:28px;font-weight:bold}main{padding:20px}button,input,select{box-sizing:border-box;width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #d4bd8b;font:inherit}button{background:#211b13;color:#f8d68d}article{background:white;padding:18px;margin:12px 0;border-radius:16px}small{color:#766347}h2{margin-top:8px}</style><header>سيبويه | منصة اللغة العربية</header><main id="m"></main><script>const m=document.getElementById('m'),s=localStorage;const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(x){m.innerHTML=x}function reg(){show('<small>نسخة محلية للتجربة فقط — لا تستخدم بيانات حقيقية</small><h2>إنشاء حساب طالب</h2><form onsubmit="signup(event)"><input id="n" required placeholder="اسم الطالب"><input id="p" required type="tel" placeholder="رقم الهاتف التجريبي"><select id="g"><option>الصف الأول الثانوي</option><option>الصف الثاني الثانوي</option><option>الصف الثالث الثانوي</option></select><button>تسجيل حساب تجريبي</button></form><button onclick="home()">دخول بالحساب المحفوظ</button><button onclick="admin()">تجربة لوحة الأونر</button>')}function signup(e){e.preventDefault();s.name=n.value;s.grade=g.value;home()}function home(){if(!s.name){reg();return}show('<h2>أهلاً '+esc(s.name)+'</h2><small>'+esc(s.grade)+'</small><article>الاشتراك: '+(active()?'مفعّل حتى '+new Date(+s.until).toLocaleDateString('ar-EG'):'بانتظار التفعيل')+'</article><button onclick="lessons()">الكورسات والمحاضرات</button><button onclick="learn()">طور نفسك</button><button onclick="quiz()">اختبار تجريبي</button><button onclick="admin()">تجربة لوحة الأونر</button><button onclick="reg()">العودة للتسجيل</button>')}function active(){return +s.until>Date.now()}function lessons(){if(!active()){show('<h2>الاشتراك غير مفعّل</h2><p>جرّب تفعيل الطالب من لوحة الأونر.</p><button onclick="home()">رجوع</button>');return}let a=JSON.parse(s.lessons||'["النحو","البلاغة","الأدب","القراءة"]');show('<h2>المحاضرات</h2>'+a.map((x,i)=>'<button onclick="watch('+i+')">'+esc(x)+'</button>').join('')+'<button onclick="home()">رجوع</button>')}function watch(i){show('<h2>مشغل الدرس التجريبي</h2><article>لا يوجد فيديو حقيقي مرفق في هذه النسخة.</article><button onclick="localStorage.setItem(\'done'+i+'\',\'1\');lessons()">إتمام الدرس</button><button onclick="lessons()">رجوع</button>')}function learn(){show('<h2>طور نفسك</h2><article>كورس تأسيس اللغة العربية — اشتراك مستقل (عرض تجريبي)</article><button onclick="home()">رجوع</button>')}function quiz(){show('<h2>اختبار تجريبي</h2><article>ما نوع كلمة «كتاب»؟<button onclick="alert(\'إجابة صحيحة\')">اسم</button><button onclick="alert(\'حاول مرة أخرى\')">فعل</button></article><button onclick="home()">رجوع</button>')}function admin(){show('<h2>لوحة الأونر التجريبية</h2><small>مفتوحة للاختبار فقط، ليست صلاحيات إنتاجية.</small><article>الطالب: '+esc(s.name||'لا يوجد')+'<button onclick="s.until=Math.max(Date.now(),+s.until||0)+2592000000;admin()">تفعيل / تجديد 30 يوم</button><button onclick="s.until=0;admin()">إيقاف الاشتراك</button></article><article>إدارة المحاضرات<input id="l" placeholder="اسم المحاضرة"><button onclick="add()">إضافة محاضرة</button></article><button onclick="home()">واجهة الطالب</button>')}function add(){let a=JSON.parse(s.lessons||'["النحو","البلاغة","الأدب","القراءة"]');if(l.value.trim()){a.push(l.value.trim());s.lessons=JSON.stringify(a)}admin()}reg();</script></html>
